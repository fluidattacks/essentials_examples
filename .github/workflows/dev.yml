name: Security Scans
on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  ci-gate-oidc-lax:
    name: CI Gate (OIDC, lax)
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: fluidattacks/ci-gate-action@flagos
        id: gate
        with:
          group: machinetest

      - name: Print result
        run: echo "vulnerabilities_found=${{ steps.gate.outputs.vulnerabilities_found }}"

  ci-gate-oidc-strict:
    name: CI Gate (OIDC, strict)
    runs-on: ubuntu-latest
    # Strict mode fails the job (exit 66) when policy-breaking vulnerabilities exist
    continue-on-error: true
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: fluidattacks/ci-gate-action@flagos
        with:
          group: machinetest
          strict: true

  ci-gate-report:
    name: CI Gate (report + repo_name)
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: fluidattacks/ci-gate-action@flagos
        id: gate
        with:
          group: machinetest
          repo_name: ${{ github.event.repository.name }}
          report_output_path: ci-gate-report.json

      - name: Show report
        run: |
          echo "report: ${{ steps.gate.outputs.report_output_path }}"
          cat ci-gate-report.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-gate-report
          path: ci-gate-report.json
          if-no-files-found: ignore

  ci-gate-no-checkout:
    name: CI Gate (no checkout)
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: fluidattacks/ci-gate-action@flagos
        with:
          group: machinetest
