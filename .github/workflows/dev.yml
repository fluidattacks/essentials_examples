name: Security Scans
on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sast:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: fluidattacks/sast-action@main
        id: scan
        with:
          scan_config_path: .github/.fluidattacks.yaml
          scanner_mode: full
          group: machinetest

      - name: Fail if vulnerabilities found
        if: steps.scan.outputs.vulnerabilities_found == 'true'
        run: exit 1

  sca-scan:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: fluidattacks/sca-action@main
        id: scan
        with:
          scan_config_path: .github/.fluidattacks.yaml
          scanner_mode: full
          group: machinetest

      - name: Fail if vulnerabilities found
        if: steps.scan.outputs.vulnerabilities_found == 'true'
        run: exit 1

  dast-scan:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: fluidattacks/dast-action@main
        id: scan
        with:
          scan_config_path: .github/.fluidattacks.yaml
          group: machinetest

      - name: Fail if vulnerabilities found
        if: steps.scan.outputs.vulnerabilities_found == 'true'
        run: exit 1

  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: fluidattacks/ss-action@main
        id: scan
        with:
          scan_config_path: .github/.fluidattacks.yaml
          group: machinetest

      - name: Fail if vulnerabilities found
        if: steps.scan.outputs.vulnerabilities_found == 'true'
        run: exit 1

  mast-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker://docker.io/fluidattacks/mast:latest
        name: mastAnalysis
        with:
          args: mast --strict scan .github/.fluidattacks.yaml
