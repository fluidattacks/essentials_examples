[project]
name = "lambda-api"
version = "0.1.0"
description = "A simple FastAPI application deployed on AWS Lambda"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1.0", "mangum>=0.19,<1.0"]

[dependency-groups]
dev = ["ruff>=0.14", "mypy>=1.15"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
